<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkworm Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; floating toolbar top-left; control panel docked right (bottom sheet on phones). */
:root{
  color-scheme: dark;
  --bg:#050404;
  --panel:rgba(14,11,10,.9);
  --panel-solid:#0e0b0a;
  --line:rgba(239,220,203,.12);
  --line-strong:rgba(239,220,203,.26);
  --fg:#efdccb;
  --muted:#9a8b7f;
  --accent:#e2462a;
  --accent-soft:rgba(226,70,42,.18);
  --ink:#0a0c16;
  --font-ui:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --panel-w:340px;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--font-mono);font-size:12px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
#ov.tool-select{cursor:default}
button,select,input,textarea{font:inherit;color:inherit}
button{background:rgba(239,220,203,.06);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:rgba(239,220,203,.12);border-color:var(--line-strong)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent-soft);border-color:var(--accent);color:#fff}
#hud,#panel summary,.row label,.seg,.btns{-webkit-user-select:none;user-select:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(var(--panel-w) + 24px);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:max-content;max-width:100%}
.brand{font-family:var(--font-ui);font-weight:600;font-size:14px;letter-spacing:.02em;padding:0 8px 0 6px}
.brand i{font-style:normal;color:var(--accent)}
.count{color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;overscroll-behavior:contain;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 14px;box-sizing:border-box;transition:transform .25s ease}
#panel.closed{transform:translateX(100%)}
body.panel-closed #hud{right:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ph h2{font-family:var(--font-ui);font-weight:600;font-size:15px;margin:0;letter-spacing:.01em}
.sel-tag{color:var(--muted);font-size:11px}
details{border-top:1px solid var(--line);padding:2px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:9px 2px;font-family:var(--font-ui);font-weight:500;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;color:var(--fg)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-family:var(--font-mono);font-size:14px}
details[open]>summary::after{content:"−"}
.rows{display:flex;flex-direction:column;gap:7px;padding:2px 2px 12px}
.row{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;min-width:0}
.row label{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg);font-size:11px}
.row.wide{grid-template-columns:118px 1fr}
.row input[type=range]{width:100%;min-width:0;accent-color:var(--accent);height:18px;margin:0}
.row input[type=color]{width:100%;height:22px;border:1px solid var(--line);border-radius:6px;background:none;padding:0 2px;cursor:pointer}
.row select{width:100%;background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;justify-self:start}
.btns{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.btns button{padding:5px 10px;font-size:11.5px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 10px}
.seg button.on{background:var(--accent-soft);color:#fff}
.sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px;border-top:1px dashed var(--line);margin-top:2px}
textarea{width:100%;box-sizing:border-box;min-height:90px;background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:10.5px;resize:vertical}
.note{color:var(--muted);font-size:11px;line-height:1.5;margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.6;z-index:10;background:var(--bg)}
body.hide-ui #hud,body.hide-ui #panel{display:none}
@media (max-width:760px){
  :root{--panel-w:100%}
  #hud{right:calc(env(safe-area-inset-right,0px) + 12px)}
  body.panel-closed #hud{right:calc(env(safe-area-inset-right,0px) + 12px)}
  #panel{top:auto;left:0;height:min(58vh,560px);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px}
  #panel.closed{transform:translateY(100%)}
  #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 150px);max-width:calc(100% - 48px);text-align:center;border-radius:14px}
  .row{grid-template-columns:110px 1fr 42px}
  .brand{display:none}
}
@media (prefers-reduced-motion:reduce){#panel,#toast,button{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov" class="tool-select"></canvas>

<div id="hud">
  <div class="bar" id="toolbar">
    <span class="brand">Inkworm<i>·</i>Lab</span>
    <button id="bPlay" title="Pause / resume (Space)">Pause</button>
    <button id="bRegrow" title="Grow every creature again (R)">Regrow</button>
    <button id="bAdd" title="Add a creature (A)">+ Creature</button>
    <button id="bDel" title="Remove the selected creature (Delete)">− Remove</button>
    <span class="count" id="count">1</span>
    <button id="bPanel" title="Show or hide controls (C)">Controls</button>
  </div>
  <div class="bar seg-bar">
    <div class="seg" id="tools" role="group" aria-label="Pointer tool">
      <button data-tool="select" class="on" title="Tap a creature to select it, drag to steer it">Select</button>
      <button data-tool="wall" title="Drag to draw a wall">Draw wall</button>
      <button data-tool="erase" title="Drag over walls to erase them">Erase</button>
      <button data-tool="attract" title="Creatures crawl toward the pointer">Lure</button>
      <button data-tool="spawn" title="Tap to place a new creature">Spawn</button>
    </div>
  </div>
</div>

<aside id="panel" aria-label="Simulation controls">
  <div class="ph"><h2>Controls</h2><span class="sel-tag" id="selTag">Editing: creature 1</span></div>
  <div id="panelBody"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<div id="err"></div>

<script>
'use strict';
(() => {
/* ============================================================
   Constants & small utilities
   ============================================================ */
const MAXN = 64;          // max spine nodes per creature (uniform array size)
const HP = 10;            // points per cilium strand
const FPV = 12;           // floats per hair vertex
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); }
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const colorCache = new Map();
function rgb(h) {
  let c = colorCache.get(h); if (c) return c;
  let s = String(h).replace('#', ''); if (s.length === 3) s = s.split('').map(x => x + x).join('');
  const n = parseInt(s, 16) || 0; c = [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  colorCache.set(h, c); return c;
}
function toHex(c) { return '#' + c.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0')).join(''); }

/* ============================================================
   Parameter schema — every knob that shapes a creature
   ============================================================ */
const F = (k, l, min, max, step, rb) => ({ k, l, min, max, step, t: 'f', rb });
const I = (k, l, min, max, rb) => ({ k, l, min, max, step: 1, t: 'i', rb });
const C = (k, l) => ({ k, l, t: 'c' });
const B = (k, l) => ({ k, l, t: 'b' });
const S = (k, l, opts, rb) => ({ k, l, t: 's', opts, rb });

const SCHEMA = [
  { name: 'Body shape', open: true, items: [
    I('segments', 'Segments', 3, MAXN, 'body'),
    F('size', 'Size (px)', 6, 120, 1),
    F('spacing', 'Segment spacing', 0.15, 2.5, 0.01),
    F('headSize', 'Head size', 0.2, 3, 0.01),
    F('headLength', 'Head length', 0.02, 0.6, 0.01),
    F('snout', 'Snout nub', 0, 1, 0.01),
    F('neckPinch', 'Neck pinch', 0, 0.95, 0.01),
    F('thickness', 'Body thickness', 0.2, 3, 0.01),
    F('bellyPos', 'Belly position', 0.1, 0.98, 0.01),
    F('tailTaper', 'Tail taper', 0, 0.98, 0.01),
    F('bulge', 'Segment bulge', 0, 0.5, 0.01),
    I('bulgePeriod', 'Bulge period', 1, 8),
    F('lumpiness', 'Lumpiness', 0, 0.6, 0.01),
    F('elong', 'Segment stretch', 0.6, 2.2, 0.01),
    S('headTop', 'Layering', ['Tail under head', 'Head under tail']),
    F('growTime', 'Grow-in time (s)', 0, 8, 0.1),
  ]},
  { name: 'Motion', open: true, items: [
    F('speed', 'Crawl speed', 0, 220, 1),
    F('wander', 'Wander', 0, 3, 0.01),
    F('wanderFreq', 'Wander rate', 0.01, 1.5, 0.01),
    F('slither', 'Slither', 0, 1.2, 0.01),
    F('slitherFreq', 'Slither rate', 0.02, 2, 0.01),
    F('peristalsis', 'Peristalsis', 0, 0.4, 0.005),
    F('periSpeed', 'Pulse speed', 0, 3, 0.01),
    F('periLength', 'Pulse wavelength', 2, 40, 0.5),
    F('breathe', 'Breathing', 0, 0.3, 0.005),
    F('breatheSpeed', 'Breath rate', 0, 2, 0.01),
    F('curl', 'Body curl (rad)', -7, 7, 0.01),
    F('headCurl', 'Head curl (rad)', -4, 4, 0.01),
    F('curlSpread', 'Head curl spread', 0.03, 0.6, 0.01),
    F('stiffness', 'Shape memory', 0, 0.6, 0.005),
    F('maxBend', 'Max joint bend', 0.05, 1.5, 0.01),
    F('avoid', 'Obstacle sense', 0, 3, 0.01),
    F('collide', 'Body solidity', 0.2, 1.2, 0.01),
  ]},
  { name: 'Skin', items: [
    C('cSkin', 'Skin'), C('cSkinHi', 'Skin highlight'),
    F('centerGlow', 'Center glow', 0, 1, 0.01),
    F('rimShade', 'Edge shading', 0, 1, 0.01),
    F('roundness', 'Segment roundness', 0, 1, 0.01),
    F('speckles', 'Speckle density', 0, 1, 0.01),
    F('speckleScale', 'Speckle scale', 4, 60, 0.5),
    F('accents', 'Red flecks', 0, 1, 0.01),
    C('cAccent', 'Fleck color'), C('cAccent2', 'Fleck glow'),
  ]},
  { name: 'Ink', items: [
    C('cInk', 'Ink'), C('cInkMid', 'Ink midtone'),
    F('inkMid', 'Midtone amount', 0, 1, 0.01),
    F('fringe', 'Feathering', 0, 3, 0.01),
    F('fringeFreq', 'Feather density', 1, 40, 0.1),
    F('inkSoft', 'Ink softness', 0.005, 0.4, 0.005),
    F('inkDepth', 'Ink depth falloff', 0.01, 1.5, 0.01),
    F('inkDetail', 'Comb lines', 0, 1, 0.01),
    F('flow', 'Ink flow speed', 0, 1, 0.005),
    F('warp', 'Marbling warp', 0, 1.5, 0.01),
    { t: 'sub', l: 'Edge streaks' },
    F('edgeAmt', 'Edge ink', 0, 1, 0.01),
    F('edgeStart', 'Edge reach', 0.05, 1.1, 0.01),
    F('edgeStreaks', 'Streak count', 1, 40, 0.5),
    { t: 'sub', l: 'Long stripes' },
    F('stripeAmt', 'Stripes', 0, 1, 0.01),
    F('stripeCount', 'Stripe count', 0.2, 8, 0.05),
    F('stripeWidth', 'Stripe width', 0, 1, 0.01),
    F('stripeOffset', 'Stripe offset', 0, 1, 0.01),
    F('stripeStart', 'Stripes start at', 0, 1, 0.01),
    { t: 'sub', l: 'Cross bands' },
    F('bandAmt', 'Bands', 0, 1, 0.01),
    F('bandPeriod', 'Band spacing', 0.08, 3, 0.01),
    F('bandWidth', 'Band width', 0, 1, 0.01),
    F('checker', 'Checker offset', 0, 1, 0.01),
    F('bandEnd', 'Bands end at', 0, 1.05, 0.01),
    { t: 'sub', l: 'Side shadow' },
    F('sideAmt', 'Side shadow', 0, 1, 0.01),
    S('sideMode', 'Shadow side', ['Inside of bend', 'Left', 'Right', 'Outside of bend']),
    F('sideWidth', 'Shadow width', 0, 1, 0.01),
    F('sideRibs', 'Rib fingers', 0, 1.5, 0.01),
  ]},
  { name: 'Outlines & membrane', items: [
    C('cRim', 'Outline color'),
    F('rimWidth', 'Outline width', 0, 5, 0.05),
    F('outlineAmt', 'Silhouette line', 0, 1, 0.01),
    F('segLines', 'Segment arcs', 0, 1, 0.01),
    I('segEvery', 'Arc every n segs', 1, 8),
    F('lightRim', 'Light rim', 0, 1, 0.01),
    F('lightRimWidth', 'Light rim width', 0.02, 0.6, 0.005),
    C('cLightRim', 'Light rim color'),
    F('membrane', 'Outer membrane', 0, 1, 0.01),
    F('membraneOffset', 'Membrane gap', 0, 30, 0.1),
    F('beads', 'Membrane beads', 0, 1, 0.01),
    C('cMembrane', 'Membrane color'),
  ]},
  { name: 'Head', items: [
    S('headStyle', 'Head pattern', ['Plain', 'Gill fan', 'Eye face']),
    I('headNodes', 'Head segments', 1, 8),
    F('fanLines', 'Gill count', 6, 120, 1),
    F('headAmt', 'Pattern strength', 0, 1, 0.01),
    F('headGlow', 'Head glow', 0, 1.5, 0.01),
  ]},
  { name: 'Cells', items: [
    F('cellAmt', 'Cell voids', 0, 1, 0.01),
    F('cellScale', 'Cell scale', 0.3, 6, 0.01),

    C('cHole', 'Void color'), C('cHoleGlow', 'Glow color'),
  ]},
  { name: 'White cilia', items: [
    F('hairDensity', 'Density', 0, 8, 0.05, 'hair'),
    F('hairFalloff', 'Head bias', 0, 1, 0.01, 'hair'),
    F('headTuft', 'Head tuft', 0, 5, 0.05, 'hair'),
    F('hairLength', 'Length', 0, 2.5, 0.01),
    F('hairWidth', 'Width', 0.2, 6, 0.05),
    F('hairCurl', 'Curl', 0, 8, 0.05),
    F('hairWave', 'Wiggle', 0, 2, 0.01),
    F('hairInset', 'Root inset', 0.4, 1.2, 0.01),
    F('hairSweep', 'Sweep back', -1.5, 1.5, 0.01),
    F('hairLine', 'Outline', 0, 3, 0.05),
    C('cHair', 'Color'), C('cHairLine', 'Outline color'),
  ]},
  { name: 'Red cilia', items: [
    F('redDensity', 'Density', 0, 8, 0.05, 'hair'),
    F('redFalloff', 'Head bias', 0, 1, 0.01, 'hair'),
    F('redLength', 'Length', 0, 2.5, 0.01),
    F('redWidth', 'Width', 0.2, 8, 0.05),
    F('redCurl', 'Curl', 0, 8, 0.05),
    F('redWave', 'Wiggle', 0, 2, 0.01),
    C('cRed', 'Root color'), C('cRed2', 'Tip color'),
  ]},
  { name: 'Tail strands & spores', items: [
    I('strandCount', 'Tail strands', 0, 40, 'hair'),
    F('strandLength', 'Strand length', 0, 6, 0.01),
    F('strandWave', 'Strand wiggle', 0, 2, 0.01),
    F('sporeRate', 'Spores / s', 0, 40, 0.1),
    F('sporeSize', 'Spore size', 0.3, 5, 0.05),
    F('sporeLife', 'Spore life (s)', 0.3, 10, 0.1),
  ]},
  { name: 'Cilia motion', items: [
    F('waveSpeed', 'Beat speed', 0, 3, 0.01),
    F('drag', 'Drag in motion', 0, 3, 0.01),
    B('hairBehind', 'Cilia behind body'),
  ]},
];
const ITEM = {};
for (const g of SCHEMA) for (const it of g.items) if (it.k) ITEM[it.k] = it;

/* ============================================================
   Presets — tuned against the five creatures in the reference clip
   ============================================================ */
const DEF = {
  segments: 34, size: 28, spacing: 0.42, headSize: 1.55, headLength: 0.12, snout: 0, neckPinch: 0.5, thickness: 1.2,
  bellyPos: 0.78, tailTaper: 0.25, bulge: 0.03, bulgePeriod: 2, lumpiness: 0.04, elong: 1.12, headTop: 0, growTime: 1.6,
  speed: 10, wander: 0.25, wanderFreq: 0.1, slither: 0.06, slitherFreq: 0.3, peristalsis: 0.05, periSpeed: 0.5, periLength: 9,
  breathe: 0.025, breatheSpeed: 0.3, curl: 0.15, headCurl: 1.35, curlSpread: 0.26, stiffness: 0.08, maxBend: 0.55, avoid: 1, collide: 0.85,
  cSkin: '#ecd8c6', cSkinHi: '#fcf2e7', centerGlow: 0.4, rimShade: 0.15, roundness: 0.15, speckles: 0.08, speckleScale: 18,
  accents: 0.12, cAccent: '#d0200f', cAccent2: '#ff6a2b',
  cInk: '#040509', cInkMid: '#353f5c', inkMid: 0.5, fringe: 1.0, fringeFreq: 14, inkSoft: 0.03, inkDepth: 0.12, inkDetail: 0.2, flow: 0.06, warp: 0.25,
  edgeAmt: 0.55, edgeStart: 0.86, edgeStreaks: 12,
  stripeAmt: 1, stripeCount: 1.9, stripeWidth: 0.5, stripeOffset: 0.22, stripeStart: 0.4,
  bandAmt: 1, bandPeriod: 0.4, bandWidth: 0.46, checker: 1, bandEnd: 0.43,
  sideAmt: 0, sideMode: 0, sideWidth: 0.4, sideRibs: 0,
  cRim: '#0b0b12', rimWidth: 1.0, outlineAmt: 0.35, segLines: 0.5, segEvery: 3,
  lightRim: 0, lightRimWidth: 0.12, cLightRim: '#fff6ec',
  membrane: 0.4, membraneOffset: 3, beads: 0.5, cMembrane: '#d8cdc3',
  headStyle: 1, headNodes: 2, fanLines: 56, headAmt: 1, headGlow: 1.0,
  cellAmt: 0, cellScale: 1.0, cellMembrane: 0.16, cellGlow: 0.8, cHole: '#080303', cHoleGlow: '#b8683a',
  hairDensity: 2.6, hairFalloff: 0.85, headTuft: 1.6, hairLength: 0.7, hairWidth: 2.0, hairCurl: 2.8, hairWave: 0.55,
  hairInset: 0.93, hairSweep: 0.3, hairLine: 0.35, cHair: '#eee3d8', cHairLine: '#0b0b10',
  redDensity: 0.8, redFalloff: 0.9, redLength: 0.3, redWidth: 2.6, redCurl: 1.4, redWave: 0.45, cRed: '#a8120c', cRed2: '#ff4a1f',
  strandCount: 0, strandLength: 2.2, strandWave: 0.35, sporeRate: 0, sporeSize: 1.4, sporeLife: 3,
  waveSpeed: 0.5, drag: 0.6, hairBehind: false,
};

const PRESETS = {
  'Fan Striper': {},
  'Plumed Grub': {
    segments: 10, size: 44, spacing: 0.55, headSize: 1.2, headLength: 0.42, neckPinch: 0.26, thickness: 1.25, bellyPos: 0.8,
    tailTaper: 0.05, bulge: 0.04, bulgePeriod: 3, lumpiness: 0.05, elong: 1.2, headTop: 1, growTime: 1.4,

        const nx = x - c.px[0], ny = y - c.py[0], nl = Math.hypot(nx, ny) || 1;
        const hx = Math.cos(c.heading), hy = Math.sin(c.heading), dn = hx * nx / nl + hy * ny / nl;
        if (dn < 0) c.heading = Math.atan2(hy - dn * ny / nl * 1.2, hx - dn * nx / nl * 1.2);
      }
      c.px[i] = x; c.py[i] = y;
    }
  },
  collideCreatures() {
    if (!scene.creatureCollide) return;
    const cs = this.creatures;
    for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++) {
      const A = cs[a], Bc = cs[b];
      if (A.bbox[2] < Bc.bbox[0] || Bc.bbox[2] < A.bbox[0] || A.bbox[3] < Bc.bbox[1] || Bc.bbox[3] < A.bbox[1]) continue;
      const k = (A.g.collide + Bc.g.collide) * 0.5;
      for (let i = 0; i < A.N; i++) for (let j = 0; j < Bc.N; j++) {
        const dx = Bc.px[j] - A.px[i], dy = Bc.py[j] - A.py[i], m = (A.r[i] + Bc.r[j]) * k, d2 = dx * dx + dy * dy;
        if (d2 < m * m && d2 > 1e-6) {
          const d = Math.sqrt(d2), p = (m - d) * 0.5 / d;
          A.px[i] -= dx * p; A.py[i] -= dy * p; Bc.px[j] += dx * p; Bc.py[j] += dy * p;
        }
      }
    }
  },
  step(dt) {
    for (const c of this.creatures) c.update(dt, this);
    if (scene.creatureCollide && this.creatures.length > 1) {
      this.collideCreatures();
      for (const c of this.creatures) this.collideWalls(c);
    }
    for (const c of this.creatures) c.frame(dt);
    this.updateSpores(dt);
    if (scene.gallery && this.creatures.length) {
      this.galleryT = (this.galleryT || 0) + dt;
      if (this.galleryT > scene.galleryInterval) {
        this.galleryT = 0;
        this.galleryIdx = ((this.galleryIdx ?? PRESET_ORDER.indexOf(scene.preset)) + 1) % PRESET_ORDER.length;
        scene.preset = PRESET_ORDER[this.galleryIdx];
        for (const c of this.creatures) { c.pending = presetGenome(scene.preset); c.fadeTarget = 0; }
        ui.syncPreset();
        setTimeout(() => ui.sync(), 300);
      }
    }
  },
  updateSpores(dt) {
    for (const c of this.creatures) {
      const g = c.g; if (g.sporeRate <= 0 || c.grow < 0.5) continue;
      c.sporeAcc += g.sporeRate * dt;
      while (c.sporeAcc >= 1) {
        c.sporeAcc -= 1;
        if (this.spores.length > 1500) break;
        const i = (Math.random() * c.N) | 0, a = Math.random() * TAU;
        const r = c.r[i];
        this.spores.push({
          x: c.px[i] + Math.cos(a) * r, y: c.py[i] + Math.sin(a) * r,
          vx: Math.cos(a) * (6 + Math.random() * 18) + c.vx[i] * 0.3, vy: Math.sin(a) * (6 + Math.random() * 18) + c.vy[i] * 0.3,
          life: 0, max: g.sporeLife * (0.5 + Math.random()), size: g.sporeSize * (0.5 + Math.random()) * g.size / 36,
          red: Math.random() < 0.45, c, seed: Math.random() * 100,
        });
      }
    }
    const sp = this.spores;
    for (let i = sp.length - 1; i >= 0; i--) {
      const s = sp[i]; s.life += dt;
      if (s.life > s.max) { sp.splice(i, 1); continue; }
      s.vx *= Math.pow(0.35, dt); s.vy *= Math.pow(0.35, dt);
      s.vx += (noise1(s.seed + s.life * 0.7) - 0.5) * 30 * dt; s.vy += (noise1(s.seed + 50 + s.life * 0.7) - 0.5) * 30 * dt - 3 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
  },
};

const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
vec2 worley(vec2 p, float t){
  vec2 i = floor(p), f = fract(p); float F1 = 8.0, F2 = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y));
    vec2 o = hash22(i + g);
    o = 0.5 + 0.42 * sin(t + 6.2831 * o);
    vec2 r = g + o - f; float d = dot(r, r);
    if (d < F1) { F2 = F1; F1 = d; } else if (d < F2) { F2 = d; }
  }
  return sqrt(vec2(F1, F2));
}`;

const BODY_VS = `#version 300 es
layout(location=0) in vec2 aPos;
uniform vec2 uRes;
out vec2 vW;
void main(){ vW = aPos; vec2 c = aPos / uRes * 2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); }`;

const BODY_FS = `#version 300 es
precision highp float;
#define MAXN ${MAXN}
#define TAU 6.28318530718
in vec2 vW; out vec4 o;
uniform vec4 uNode[MAXN];   // x, y, radius, arclength-from-head
uniform vec4 uTan[MAXN];    // tangent.xy (toward head), curvature, headness
uniform int uN, uHeadTop;
uniform float uR0, uLen, uTime, uSeed, uAA, uPx, uAlpha, uElong;
uniform vec3 uHead; uniform vec2 uHeadDir;
uniform vec3 cSkin, cSkinHi, cInk, cInkMid, cRim, cLightRim, cAccent, cAccent2, cMembrane, cHole, cHoleGlow;
uniform vec4 pInkA, pInkB, pInkC, pInkD, pInkE, pInkF, pInkG, pSkin, pSkin2, pRim, pRim2, pHead, pCell, pMem;
${GLSL_NOISE}

vec3 shade(int i, vec2 p, bool interior, out float din){
  vec4 N = uNode[i]; vec4 T = uTan[i];
  vec2 t = T.xy;
  vec2 d = p - N.xy;
  float al = dot(d, t), ac = t.x*d.y - t.y*d.x;
  float r = N.z;
  vec2 e = vec2(al/(r*uElong), ac/r);
  float q = length(e);
  din = (1.0 - q) * r;
  float tm = uTime * pInkE.y;
  float U = (N.w - al) / uR0;
  float V = ac / r;
  float tt = clamp((N.w - al) / max(uLen, 1.0), 0.0, 1.0);
  float ang = atan(e.y, e.x);
  vec2 cs = vec2(cos(ang), sin(ang));
  float wU = U, wV = V;
  if (pInkE.z > 0.0) {
    wV += pInkE.z * (vnoise(vec2(U*0.8, tm*0.5 + 3.0)) - 0.5);
    wU += pInkE.z * (vnoise(vec2(U*0.5 + 11.0, V*0.8 + tm*0.5)) - 0.5);
  }
  float fa = pInkA.w, ff = pInkD.z, soft = pInkD.w, dep = max(pInkG.x, 0.01);
  float hn = T.w, notHead = 1.0 - hn;
  float ink = 0.0, deep = 0.0;
  // coverage (feathered edge) and depth (how far inside the ink a pixel is)
  #define ACC(amt, f, th) { float s_ = smoothstep((th) - soft, (th) + soft, f); float d_ = smoothstep(th, (th) + dep, f); ink = max(ink, (amt)*s_); deep = max(deep, (amt)*d_); }
  // end caps (front of the head, tip of the tail) use the disc's polar frame,
  // everything else uses body coordinates so patterns run continuously along the body
  float cap = 0.0;
  if (i == 0) cap = smoothstep(-0.1, 0.55, e.x);
  if (i == uN - 1) cap = max(cap, smoothstep(-0.1, 0.55, -e.x));
  float bodyQ = mix(abs(V), q, cap);
  // edge streaks: dark ink creeping in from the rim, combed perpendicular to the edge
  if (pInkA.x > 0.0) {
    float k = pInkA.z * r / uR0;
    float sd = sign(V + 1e-4)*7.0;
    float a = wU*pInkA.z*0.32, c = abs(V);
    float ns = 0.55*snoise(vec3(a, c*1.2 + tm, sd)) + 0.3*snoise(vec3(a*2.6, c*2.0 - tm, sd + 3.0)) + 0.22*snoise(vec3(a*6.5, c*1.4, sd + 5.0));
    float nc = 0.55*snoise(vec3(cs*k, q*1.2 + tm + float(i)*1.7)) + 0.3*snoise(vec3(cs*k*2.6, q*2.0 - tm + float(i)*0.37)) + 0.22*snoise(vec3(cs*k*6.5, q*1.4 + float(i)*0.71));
    float f = bodyQ + fa*0.3*mix(ns, nc, cap);
    ACC(pInkA.x, f, pInkA.y);
  }
  // longitudinal stripes with comb-feathered edges
  if (pInkB.x > 0.0) {
    float n = 0.4*snoise(vec3(wU*ff*0.6, wV*1.3, tm + 3.0)) + 0.3*snoise(vec3(wU*ff*2.3, wV*1.6, tm + 7.0)) + 0.3*snoise(vec3(wU*ff*6.0, wV*1.1, 11.0)) + 0.18*snoise(vec3(wU*ff*13.0, wV*0.9, 13.0));
    float sv = (wV*0.5 + 0.5)*pInkB.y + pInkB.w + fa*0.12*n;
    float f = 1.0 - abs(fract(sv) - 0.5)*2.0;
    float m = smoothstep(pInkF.x - 0.08, pInkF.x + 0.08, tt) * notHead;
    ACC(pInkB.x*m, f, 1.0 - pInkB.z);
  }
  // transverse bands (checkered across the midline)
  if (pInkC.x > 0.0) {
    float n = 0.45*snoise(vec3(wU*0.9, wV*ff*0.4, tm + 13.0)) + 0.3*snoise(vec3(wU*1.7, wV*ff*1.3, tm + 17.0)) + 0.28*snoise(vec3(wU*1.3, wV*ff*3.5, 19.0));
    float su = wU/pInkC.y + fa*0.11*n + pInkC.w*0.5*step(0.0, V);
    float f = 1.0 - abs(fract(su) - 0.5)*2.0;
    float m = (1.0 - smoothstep(pInkF.y - 0.06, pInkF.y + 0.06, tt)) * notHead;
    ACC(pInkC.x*m, f, 1.0 - pInkC.z);
  }
  // side shadow
  if (pInkD.x > 0.0) {
    float sideS = pInkD.y < 0.5 ? clamp(T.z*8.0, -1.0, 1.0) : (pInkD.y < 1.5 ? 1.0 : (pInkD.y < 2.5 ? -1.0 : -clamp(T.z*8.0, -1.0, 1.0)));
    float n = 0.55*snoise(vec3(wU*ff, wV*1.1, tm + 23.0)) + 0.3*snoise(vec3(wU*ff*2.1, wV*2.0, tm + 29.0)) + 0.22*snoise(vec3(wU*ff*5.0, wV*1.5, 37.0));
    float rib = abs(fract(wU/pInkC.y + 0.25) - 0.5)*2.0;
    float f = V*sign(sideS) + fa*0.3*n + pInkG.y*(rib - 0.5)*0.9*notHead;
    ACC(pInkD.x*abs(sideS), f, 1.0 - 2.0*pInkF.z);
  }
  // fine light comb lines running through the ink
  if (pInkE.x > 0.0 && ink > 0.01) {
    float dn = snoise(vec3(wU*ff*3.2, wV*2.4, tm*0.7 + 31.0));
    float dl = 1.0 - pInkE.x * smoothstep(0.35, 0.7, dn);
    ink *= dl; deep *= dl;
  }

  float shapeQ = mix(bodyQ, q, pSkin2.y);
  vec3 col = mix(cSkin, cSkinHi, pSkin.x * (1.0 - shapeQ*shapeQ));

  // speckles
  if (pSkin.y > 0.0) {
    vec2 sp = vec2(U, V*r/uR0) * pSkin.z;
    vec2 ci = floor(sp), cf = fract(sp);
    float h0 = hash12(ci + uSeed*0.1);
    if (h0 < pSkin.y) {
      vec2 c0 = 0.25 + 0.5*hash22(ci + 17.0);
      float rad = 0.07 + 0.14*hash12(ci + 5.3);
      float dd = length((cf - c0)*vec2(1.0, 0.6 + 0.8*h0/max(pSkin.y,1e-3)));
      float px = uAA*pSkin.z/uR0;
      float dt = 1.0 - smoothstep(rad - px, rad + px, dd);
      col = mix(col, cInk, dt * 0.92 * (1.0 - 0.5*ink));
    }
  }
  // cellular voids
  if (pCell.x > 0.0) {
    vec2 cp = vec2(U, V*r/uR0) * pCell.y + uSeed*0.37;
    cp += 0.32*vec2(snoise(vec3(cp*0.9, tm + 3.0)), snoise(vec3(cp*0.9 + 5.0, tm + 7.0)));
    vec2 Fw = worley(cp, uTime*0.35);
    float edge = Fw.y - Fw.x;
    float mw = pCell.z * (0.6 + 0.8*vnoise(cp*3.5));
    float hole = smoothstep(mw, mw + 0.1, edge) * (1.0 - smoothstep(0.55, 0.9, Fw.x)) * (1.0 - smoothstep(0.62, 0.82, q));
    float glow = pCell.w * (1.0 - smoothstep(0.0, 0.62, Fw.x)) * (0.55 + 0.45*snoise(vec3(cp*0.7, tm + 41.0)));
    vec3 hc = mix(cHole, cHoleGlow, clamp(glow, 0.0, 1.0));
    col = mix(col, hc, hole * pCell.x);
  }
  // ink: midtone at the feathered fringe, full ink deeper in
  col = mix(col, cInkMid, ink * pInkE.w);
  col = mix(col, cInk, max(deep, ink*(1.0 - pInkE.w)));

  // head patterns
  if (hn > 0.0 && pHead.x > 0.5) {
    vec2 hd = p - uHead.xy;
    vec2 hl = vec2(dot(hd, uHeadDir), uHeadDir.x*hd.y - uHeadDir.y*hd.x) / uHead.z;
    float hr = length(hl);
    if (pHead.x < 1.5) {
      float ha = atan(hl.y, hl.x);
      float wob = 0.22*snoise(vec3(hl*1.8, tm + 51.0));
      float L = abs(fract(ha/TAU*pHead.y + wob) - 0.5)*2.0;
      float aaL = 2.0*pHead.y*uAA / (TAU*max(hr, 0.02)*uHead.z);
      float lw = 0.26;
      float line = 1.0 - smoothstep(lw - aaL, lw + aaL, L);
      line *= smoothstep(0.16, 0.42, hr) * (1.0 - smoothstep(0.82, 1.0, hr)) * smoothstep(lw*3.0, lw, aaL);
      col = mix(col, mix(cInkMid, cInk, 0.6), line * pHead.z * hn);
      float glow = exp(-hr*hr*11.0) * pHead.w;
      col = mix(col, cSkinHi, clamp(glow, 0.0, 1.0) * hn);
    } else {
      float amt = pHead.z * hn;
      float inner = 1.0 - smoothstep(0.76, 0.8, hr);
      float gapN = snoise(vec3(hl*3.2, tm + 71.0));
      vec3 cav = mix(mix(cInkMid, cSkin, 0.25), cInk, 0.25 + 0.3*gapN);
      cav = mix(cav, mix(cAccent, cAccent2, 0.5 + 0.5*gapN), smoothstep(0.3, 0.6, gapN) * 0.8);
      col = mix(col, cav, inner * amt * 0.9);
      col = mix(col, cRim, (1.0 - smoothstep(0.012, 0.03, abs(hr - 0.8))) * 0.8 * amt);
      // pale vesicles packed inside the face ring
      float fseed = floor(uSeed*0.01);
      for (int b = 0; b < 12; b++) {
        vec2 hb = hash22(vec2(float(b)*7.1 + fseed, 3.0));
        float a = float(b)/12.0*TAU*1.9 + (hb.x - 0.5)*0.6;
        float rr = b < 2 ? 0.12*float(b) : 0.3 + 0.32*hb.y;
        vec2 bc = vec2(cos(a), sin(a))*rr + vec2(0.05, 0.1);
        float br = b == 0 ? 0.15 : 0.08 + 0.08*hash12(vec2(float(b), 9.0 + fseed));
        vec2 bdv = (hl - bc)/br; float bd = length(bdv);
        if (bd < 1.15) {
          vec3 bcol = mix(cSkinHi, mix(cSkin, cInkMid, 0.25), smoothstep(0.55, 1.0, bd) * 0.7);
          col = mix(col, bcol, (1.0 - smoothstep(0.94, 1.0, bd)) * amt * inner);
          col = mix(col, cRim, (1.0 - smoothstep(0.0, 0.1, abs(bd - 1.0))) * amt * inner * 0.9);
        }
      }
      // fine pale filaments looping across the cavity
      float sl = abs(fract(atan(hl.y, hl.x)/TAU*14.0 + hr*2.2 + 0.25*snoise(vec3(hl*2.0, tm))) - 0.5);
      col = mix(col, cSkinHi, (1.0 - smoothstep(0.02, 0.06, sl)) * inner * smoothstep(0.2, 0.5, hr) * 0.45 * amt);
      // the eye: a big glossy sphere in the lower half
      vec2 ec = vec2(-0.05, -0.32); float er = 0.42;
      vec2 ed = (hl - ec)/er; float de = length(ed);
      if (de < 1.1) {
        vec3 eyeC = mix(mix(cInkMid, cSkin, 0.25), cInk, smoothstep(0.0, 1.1, de - 0.35*ed.y));
        eyeC = mix(eyeC, cSkinHi, (1.0 - smoothstep(0.0, 0.3, length(ed - vec2(0.25, 0.42)))) * 0.6);
        eyeC = mix(eyeC, cSkinHi*0.85, (1.0 - smoothstep(0.012, 0.04, abs(de - 0.84))) * 0.5);
        col = mix(col, eyeC, (1.0 - smoothstep(0.97, 1.0, de)) * amt);
        col = mix(col, cRim, (1.0 - smoothstep(0.0, 0.045, abs(de - 1.0))) * amt);
      }
    }
  }
  // red flecks near the rim
  if (pSkin2.x > 0.0) {
    float an = snoise(vec3(U*4.0, V*3.0, tm + 61.0));
    float red = smoothstep(0.48, 0.62, an) * smoothstep(0.5, 0.88, bodyQ) * pSkin2.x;
    col = mix(col, mix(cAccent, cAccent2, smoothstep(0.5, 0.9, an)), red);
  }
  col *= 1.0 - pSkin.w * pow(shapeQ, 5.0);
  // light rim (thick bright membrane around each segment)
  if (pRim.z > 0.0) {
    float n1 = snoise(vec3(cs*3.0, tm + float(i)));
    float lr = smoothstep(1.0 - pRim.w - 0.025 + 0.035*n1, 1.0 - pRim.w + 0.025 + 0.035*n1, q);
    col = mix(col, cLightRim, lr * pRim.z);
  }

/* ============================================================
   Walls presets
   ============================================================ */
function addPoly(pts, closed) {
  for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; world.walls.push([a[0], a[1], b[0], b[1]]); }
}
const WALL_PRESETS = {
  Box() { const m = Math.min(world.w, world.h) * 0.08, W = world.w, H = world.h; addPoly([[m, m], [W - m, m], [W - m, H - m], [m, H - m]], true); },
  Arena() { const cx = world.w / 2, cy = world.h / 2, r = Math.min(world.w, world.h) * 0.44, pts = []; for (let i = 0; i < 48; i++) { const a = i / 48 * TAU; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } addPoly(pts, true); },

  if (tool === 'select') { for (const c of world.creatures) c.drag = null; }
  else if (tool === 'wall') {
    if (scene.freehand && pointer.path.length > 1) { pointer.path.push([pointer.x, pointer.y]); addPoly(pointer.path, false); }
    else if (pointer.start && Math.hypot(pointer.x - pointer.start.x, pointer.y - pointer.start.y) > 6) world.walls.push([pointer.start.x, pointer.start.y, pointer.x, pointer.y]);
  } else if (tool === 'attract' && pointer.type !== 'mouse') world.lure = null;
  pointer.start = null; pointer.path = null;
}
ov.addEventListener('pointerup', endPointer);
ov.addEventListener('pointercancel', endPointer);
ov.addEventListener('pointerleave', () => { pointer.inside = false; if (tool === 'attract' && !pointer.down) world.lure = null; });

window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === ' ') { setPaused(!scene.paused); e.preventDefault(); }
  else if (k === 'r' || k === 'R') { for (const c of world.creatures) c.grow = 0; }
  else if (k === 'a' || k === 'A') spawn();
  else if (k === 'Delete' || k === 'Backspace') removeSelected();
  else if (k === 'h' || k === 'H') { document.body.classList.toggle('hide-ui'); resize(); }
  else if (k === 'c' || k === 'C') setPanel($('panel').classList.contains('closed'));
  else if (k === 'g' || k === 'G') { scene.gallery = !scene.gallery; world.galleryT = 0; ui.sync(); toast(scene.gallery ? 'Gallery cycling on' : 'Gallery cycling off'); }
  else if (k >= '1' && k <= '5') applyPreset(PRESET_ORDER[+k - 1]);
});
window.addEventListener('resize', resize);

/* ============================================================
   Boot
   ============================================================ */
// start zoomed so a full-size creature fits comfortably on any screen
scene.zoom = Math.round(clamp(Math.min(window.innerWidth, window.innerHeight) / 640, 0.6, 1.3) * 100) / 100;
resize();
ui.build();
const startPreset = (location.hash || '').replace('#', '');
if (PRESET_ORDER.some(p => p.replace(/\s/g, '-').toLowerCase() === startPreset)) scene.preset = PRESET_ORDER.find(p => p.replace(/\s/g, '-').toLowerCase() === startPreset);
const first = new Creature(presetGenome(scene.preset), world.w * 0.5, world.h * 0.5, -Math.PI / 2 + 0.4);
world.creatures.push(first);
select(first);
ui.count();
setPanel(window.innerWidth > 760);
setTimeout(() => toast('Tap a creature to select it. Use Draw wall to add obstacles.'), 900);

let last = performance.now(), acc = 0;
const DT = 1 / 60;
function loop(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000); last = now;
  if (!scene.paused) {
    acc += elapsed * scene.timeScale;
    let n = 0;
    while (acc >= DT && n < 6) { world.step(DT); acc -= DT; n++; }
    if (n === 6) acc = 0;
  }
  selPulse = Math.max(0, selPulse - elapsed);
  render(now / 1000);
  requestAnimationFrame(loop);
}
// expose for debugging / automation
window.inkworm = { world, scene, spawn, applyPreset, select, PRESETS, DEF, step: dt => world.step(dt), render: () => render(performance.now() / 1000) };
requestAnimationFrame(loop);
})();
</script>
